{% extends 'index.html' %}{% load static %}{% block content %}
<style>
    .navbar .nav-link {
        color: #000 !important;
    }

    .gallery {
        width: 90%;
        margin: auto;
        box-shadow: rgba(0, 0, 0, 0.16) 0px 10px 36px 0px, rgba(0, 0, 0, 0.06) 0px 0px 0px 1px;
        cursor: pointer;
    }

    .gallery img {
        width: 100%;
    }
</style>
<!-- Bootstrap CSS -->
<!-- <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"> -->

<!-- Bootstrap JS and dependencies -->
<!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<!-- Popper.js (required for Bootstrap modals) -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Page Header Start -->
<div class="container-fluid page-header py-5 mb-5 wow fadeIn" data-wow-delay="0.1s">
    <div class="container py-5">
        <h1 class="display-1 text-white animated slideInDown">Testimonial</h1>
        <nav aria-label="breadcrumb animated slideInDown">
            <ol class="breadcrumb text-uppercase mb-0">
                <li class="breadcrumb-item"><a class="text-white" href="#">Home</a></li>
                <li class="breadcrumb-item"><a class="text-white" href="#">Services</a></li>
                <li class="breadcrumb-item text-primary active" aria-current="page">Testimonial</li>
            </ol>
        </nav>
    </div>
</div>
<!-- Page Header End -->

<section class="from-blog spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 wow fadeInUp" data-wow-delay="0.1s">
                <div class="section-title from-blog__title">
                    <h2 style="color: #3673b2;">Testimonial</h2>
                </div>
            </div>
        </div>

        <!-- Gallery with modal trigger -->
        <div class="row mt-4">
            {% for item in testimonial %}
            <div class="col-md-6">
                <div class="wrap">
                    <div class="gallery wow fadeInLeft" data-toggle="modal"
                        data-target="#videoModal{{ forloop.counter }}">
                        <div class="video-container">
                            <video src="{{ item.video.url }}" controls autoplay muted loop
                                alt="Testimonial thumbnail"></video>
                        </div>
                        <h3 class="text-center text-primary mb-4">Client: {{ item.client }}</h3>
                    </div>
                </div>
            </div>

            <!-- Modal for each video -->
            <div class="modal fade" id="videoModal{{ forloop.counter }}" tabindex="-1"
                aria-labelledby="videoModalLabel{{ forloop.counter }}" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="videoModalLabel{{ forloop.counter }}">Client: {{ item.client }}
                            </h5>
                            <button type="button" class="close" onclick="pauseVideo('{{item.id}}val')"
                                data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="modal-body">
                            <div class="modal-video-container">
                                <video id="{{item.id}}val" controls>
                                    <source src="{{ item.video.url }}" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <style>
            /* Gallery video container */
            .video-container {
                position: relative;
                width: 100%;
                height: 250px;
                /* Set fixed height for gallery videos */
                overflow: hidden;
                border-radius: 8px;
                background: #000;
            }

            .video-container video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                /* This will crop the video to fit the container */
                object-position: center;
            }

            /* Alternative: Use contain instead of cover to show full video without cropping */
            .video-container.fit-contain video {
                object-fit: contain;
                /* This will show the full video with letterboxing if needed */
            }

            /* Modal video container */
            .modal-video-container {
                position: relative;
                width: 100%;
                max-height: 70vh;
                /* Limit modal video height to 70% of viewport */
                overflow: hidden;
            }

            .modal-video-container video {
                width: 100%;
                height: auto;
                max-height: 70vh;
                object-fit: contain;
                /* Keep full video visible in modal */
            }

            /* Gallery wrapper styling */
            .gallery {
                cursor: pointer;
                transition: transform 0.3s ease;
            }

            .gallery:hover {
                transform: scale(1.02);
            }

            /* Responsive adjustments */
            @media (max-width: 768px) {
                .video-container {
                    height: 200px;
                }

                .modal-video-container video {
                    max-height: 60vh;
                }
            }

            @media (max-width: 576px) {
                .video-container {
                    height: 180px;
                }

                .modal-video-container video {
                    max-height: 50vh;
                }
            }
        </style>

    </div>
</section>

<script>

    function pauseVideo(videoid) {
        // Get the video element by its ID
        const video = document.getElementById(videoid);

        // Check if the video element exists
        if (video) {
            // Pause the video
            video.pause();
        } else {
            console.log('Video element not found');
        }
    }
</script>



{% endblock %}
